name: Dart

# Client workflow (rewritten Q-170): the old file triggered on main only and
# assumed a Dart project at the repo root, where none exists. It now builds
# the Flutter skeleton under client/.

on:
  push:
    branches: ["feat/governance-v2", "main"]
    paths: ["client/**", ".github/workflows/dart.yml"]
  pull_request:
    branches: ["main"]
    paths: ["client/**", ".github/workflows/dart.yml"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze project source
        working-directory: client
        run: flutter analyze

      - name: Run tests
        working-directory: client
        run: flutter test
